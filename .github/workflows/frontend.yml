name: Frontend

on:
  push:
    paths:
      - "custom_components/gridpilot/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "custom_components/gridpilot/frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check custom_components/gridpilot/frontend/gridpilot-card.js
