[project]
name = "gridpilot"
version = "0.1.11"
description = "Home Assistant energy orchestration integration"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
